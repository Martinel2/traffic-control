services:
  my-api-server:
    build: . # 현재 디렉토리의 Dockerfile을 사용
    container_name: my-api-server
    ports:
      - "8080:8080" # 로컬 8080 <-> 컨테이너 8080
    # 메모리 제한을 고정해 옵션이 없을 때의 기본 최대 힙(제한의 25% = 1GB)도 실험마다 같게 한다.
    mem_limit: 4g
    environment:
      # JVM 옵션은 JAVA_TOOL_OPTIONS로 넘겨야 java가 읽는다. 값은 실행할 때 JVM_OPTS로 바꾼다.
      # 예: JVM_OPTS="-Xms512m -Xmx2g -XX:+UseShenandoahGC" docker compose up -d --build
      # 적용 여부 확인: docker exec my-api-server jcmd 1 VM.flags
      - JAVA_TOOL_OPTIONS=${JVM_OPTS:-}
    networks:
      - monitoring-net

  # 2. Prometheus (3단계 설정파일 사용)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090" # 로컬 9090 <-> Prometheus
    volumes:
      # 현재 디렉토리의 prometheus.yml을 컨테이너 내부로 마운트
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring-net

  # 3. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000" # 로컬 3000 <-> Grafana
    networks:
      - monitoring-net
    volumes:
      - ./grafana-data:/var/lib/grafana

# 컨테이너들이 서로 통신할 네트워크
networks:
  monitoring-net:
    driver: bridge